# The actions in .github/workflows are pinned to commit SHAs. Dependabot opens a pull request when a pinned
# action has a new release, and CI runs on that pull request like on any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @types/node follows the lowest Node.js version the package supports (engines node >=22),
      # so the compiler flags any use of an API that Node.js 22 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
